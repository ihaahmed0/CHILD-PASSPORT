name: Deploy Django to Azure

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AZURE_WEBAPP_NAME: 'django-web-app-914b2d44'
  RESOURCE_GROUP: 'django-app-rg'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # STEP 1: CHECKOUT CODE
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: SET UP PYTHON WITH CACHING
      # ============================================
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ============================================
      # STEP 3: INSTALL DEPENDENCIES
      # ============================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================
      # STEP 4: COLLECT STATIC FILES
      # ============================================
      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost'

      # ============================================
      # STEP 5: CREATE DEPLOYMENT PACKAGE
      # ============================================
      - name: Create deployment package
        run: |
          zip -r deployment.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "venv/*" \
            -x "env/*" \
            -x ".venv/*" \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x "*/__pycache__/*" \
            -x "*/*/__pycache__/*" \
            -x "db.sqlite3" \
            -x ".env*" \
            -x "*.md" \
            -x ".gitignore" \
            -x ".DS_Store" \
            -x "*.log"
          echo "Deployment package size: $(du -sh deployment.zip | cut -f1)"

      # ============================================
      # STEP 6: LOGIN TO AZURE
      # ============================================
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ============================================
      # STEP 7: CONFIGURE AZURE APP SETTINGS
      # Only runs once unless config changes — idempotent
      # ============================================
      - name: Configure Azure App Settings
        run: |
          # Disable Oryx rebuild (we ship a complete package from CI)
          az webapp config appsettings set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              WEBSITE_RUN_FROM_PACKAGE=0

          # Set Python runtime
          az webapp config set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --linux-fx-version "PYTHON|${{ env.PYTHON_VERSION }}"

          # Point startup to startup.sh so migrations run on every boot
          az webapp config set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --startup-file "/home/site/wwwroot/startup.sh"

      # ============================================
      # STEP 8: DEPLOY TO AZURE
      # ============================================
      - name: Deploy to Azure Web App
        run: |
          az webapp deployment source config-zip \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --src deployment.zip \
            --timeout 600

      # ============================================
      # STEP 9: RESTART TO APPLY CHANGES & RUN MIGRATIONS
      # startup.sh runs migrate + seed on every restart
      # ============================================
      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }}

      # ============================================
      # STEP 10: WAIT FOR APP TO BE READY (HEALTH CHECK)
      # ============================================
      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to respond..."
          MAX_ATTEMPTS=20
          ATTEMPT=0
          URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/docs/"

          until [ $ATTEMPT -ge $MAX_ATTEMPTS ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS — HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "App is ready."
              break
            fi

            ATTEMPT=$((ATTEMPT+1))
            sleep 10
          done

          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo "App did not become ready in time. Check Azure logs."
            exit 1
          fi

      # ============================================
      # STEP 11: CLEANUP
      # ============================================
      - name: Cleanup
        if: always()
        run: rm -f deployment.zip

      # ============================================
      # STEP 12: DEPLOYMENT SUMMARY
      # ============================================
      - name: Deployment summary
        if: always()
        run: |
          echo "================================================"
          echo "Application : ${{ env.AZURE_WEBAPP_NAME }}"
          echo "Resource    : ${{ env.RESOURCE_GROUP }}"
          echo "Python      : ${{ env.PYTHON_VERSION }}"
          echo "URL         : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "API Docs    : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/docs/"
          echo "Admin       : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/admin/"
          echo "================================================"
