# Build and deploy Django app to Azure Web App
name: Build and deploy Python app to Azure Web App - child-passport

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python version
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Collect static files
        run: |
          source venv/bin/activate
          python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost'
      
      - name: Zip artifact for deployment
        run: zip release.zip ./* -r -x "*.git*" "venv/*" "*.pyc" "__pycache__/*" "db.sqlite3" ".env*"
      
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group django-app-rg \
            --name django-web-app-914b2d44 \
            --src-path release.zip \
            --type zip \
            --timeout 300
      
      - name: Restart Web App
        run: |
          az webapp restart \
            --resource-group django-app-rg \
            --name django-web-app-914b2d44