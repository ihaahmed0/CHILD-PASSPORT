name: Deploy Django to Azure

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AZURE_WEBAPP_NAME: 'django-web-app-914b2d44'
  RESOURCE_GROUP: 'django-app-rg'

# Prevent two deploys racing each other
concurrency:
  group: production-deploy
  cancel-in-progress: false

# ══════════════════════════════════════════════════════
# JOB 1 — BUILD
# ══════════════════════════════════════════════════════
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost'

      - name: Create deployment zip
        run: |
          zip -r deployment.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "venv/*" "env/*" ".venv/*" \
            -x "*.pyc" \
            -x "__pycache__/*" "*/__pycache__/*" "*/*/__pycache__/*" \
            -x "db.sqlite3" \
            -x ".env" ".env.*" \
            -x "*.md" ".gitignore" ".DS_Store" \
            -x "*.log" \
            -x "deploy*.zip" "manual-deploy.zip" "publish-profile.xml"
          echo "Package size: $(du -sh deployment.zip | cut -f1)"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.zip
          retention-days: 1

  # ══════════════════════════════════════════════════════
  # JOB 2 — DEPLOY
  # ══════════════════════════════════════════════════════
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Configure App Service ────────────────────────
      # - Oryx builds on deploy (installs requirements.txt → antenv)
      # - Startup command is gunicorn directly — no startup script needed
      - name: Configure Azure App Service
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              WEBSITE_RUN_FROM_PACKAGE=0

          az webapp config set \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --linux-fx-version "PYTHON|${{ env.PYTHON_VERSION }}" \
            --startup-file "gunicorn childpassport.wsgi --bind=0.0.0.0:8000 --workers=2 --timeout=120 --preload --access-logfile=- --error-logfile=- --log-level=info"

      # ── Deploy ───────────────────────────────────────
      # config-zip is synchronous: it waits for Oryx to finish
      # building (pip install → antenv) before returning.
      # The app then restarts automatically.
      - name: Deploy to Azure
        run: |
          az webapp deployment source config-zip \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --src deployment.zip \
            --timeout 600

      # ── Run migrations via Kudu API ──────────────────
      # Kudu runs commands directly inside the app container,
      # independently of gunicorn — no HTTP involved.
      # This runs AFTER Oryx has built antenv, so all packages exist.
      - name: Run database migrations
        run: |
          echo "Fetching Kudu credentials..."
          KUDU_USER=$(az webapp deployment list-publishing-credentials \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --query "publishingUserName" -o tsv)
          KUDU_PASS=$(az webapp deployment list-publishing-credentials \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --query "publishingPassword" -o tsv)

          echo "Running migrations..."
          RESPONSE=$(curl -s -X POST \
            "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/command" \
            -u "${KUDU_USER}:${KUDU_PASS}" \
            -H "Content-Type: application/json" \
            -d '{
              "command": "source antenv/bin/activate && python manage.py migrate --noinput && (python manage.py seed_assessment_categories 2>/dev/null || true)",
              "dir": "/home/site/wwwroot"
            }')

          echo "--- Migration output ---"
          echo "$RESPONSE" | jq -r '.Output // "no output"'

          ERRORS=$(echo "$RESPONSE" | jq -r '.Error // ""')
          [ -n "$ERRORS" ] && echo "--- Errors ---" && echo "$ERRORS"

          EXIT_CODE=$(echo "$RESPONSE" | jq -r '.ExitCode // 1')
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migrations failed (exit code $EXIT_CODE). Aborting deployment."
            exit 1
          fi
          echo "Migrations completed successfully."

      # ── Health check ─────────────────────────────────
      # Polls every 10 s for up to 3 minutes.
      # On failure, tails the live app logs automatically.
      - name: Health check
        run: |
          URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/docs/"
          MAX=18
          i=0
          echo "Polling $URL ..."
          while [ $i -lt $MAX ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "  [$(( i * 10 ))s] HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "App is healthy."
              exit 0
            fi
            i=$(( i + 1 ))
            sleep 10
          done
          echo "App did not respond within 3 minutes — fetching logs..."
          az webapp log tail \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --timeout 15 || true
          exit 1

      - name: Cleanup
        if: always()
        run: rm -f deployment.zip

      - name: Deployment summary
        if: always()
        run: |
          echo "================================================"
          echo "App   : ${{ env.AZURE_WEBAPP_NAME }}"
          echo "URL   : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "Docs  : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/docs/"
          echo "Admin : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/admin/"
          echo "================================================"
