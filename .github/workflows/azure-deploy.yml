name: Deploy Django to Azure

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AZURE_WEBAPP_NAME: 'django-web-app-914b2d44'
  RESOURCE_GROUP: 'django-app-rg'

# Prevent two deploys racing each other
concurrency:
  group: production-deploy
  cancel-in-progress: false

# ══════════════════════════════════════════════════════
# JOB 1 — BUILD
# ══════════════════════════════════════════════════════
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost'

      - name: Create deployment zip
        run: |
          zip -r deployment.zip . \
            -x "*.git*" \
            -x ".github/*" \
            -x "venv/*" "env/*" ".venv/*" \
            -x "*.pyc" \
            -x "__pycache__/*" "*/__pycache__/*" "*/*/__pycache__/*" \
            -x "db.sqlite3" \
            -x ".env" ".env.*" \
            -x "*.md" ".gitignore" ".DS_Store" \
            -x "*.log" \
            -x "deploy*.zip" "manual-deploy.zip" "publish-profile.xml"
          echo "Package size: $(du -sh deployment.zip | cut -f1)"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.zip
          retention-days: 1

  # ══════════════════════════════════════════════════════
  # JOB 2 — DEPLOY
  # ══════════════════════════════════════════════════════
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Configure App Service (idempotent) ───────────
      - name: Configure Azure App Service
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              WEBSITE_RUN_FROM_PACKAGE=0

          az webapp config set \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --linux-fx-version "PYTHON|${{ env.PYTHON_VERSION }}" \
            --startup-file "gunicorn childpassport.wsgi --bind=0.0.0.0:8000 --workers=2 --timeout=120 --access-logfile=- --error-logfile=- --log-level=info"

      # ── Fetch Kudu credentials ───────────────────────
      # Needed for both deployment and migrations.
      - name: Fetch Kudu credentials
        id: kudu
        run: |
          USER=$(az webapp deployment list-publishing-credentials \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --query "publishingUserName" -o tsv)
          PASS=$(az webapp deployment list-publishing-credentials \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --query "publishingPassword" -o tsv)
          echo "kudu_user=$USER" >> $GITHUB_OUTPUT
          echo "kudu_pass=$PASS" >> $GITHUB_OUTPUT

      # ── Deploy via Kudu REST API ─────────────────────
      # Uses isAsync=true so we POST the zip and get back
      # immediately (HTTP 202). We then poll the deployment
      # status ourselves — no more "stuck at starting site".
      #
      # Kudu deployment status codes:
      #   0 = Pending  1 = Building  2 = Deploying
      #   3 = Failed   4 = Success
      - name: Deploy zip (async)
        run: |
          echo "Uploading zip to Kudu..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zipdeploy?isAsync=true" \
            -u "${{ steps.kudu.outputs.kudu_user }}:${{ steps.kudu.outputs.kudu_pass }}" \
            -H "Content-Type: application/zip" \
            --data-binary @deployment.zip \
            --max-time 120)

          if [ "$HTTP" != "202" ]; then
            echo "Upload failed — HTTP $HTTP"
            exit 1
          fi
          echo "Upload accepted (HTTP 202). Oryx is building..."

      - name: Wait for Oryx build to complete
        run: |
          KUDU="https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/deployments/latest"
          MAX=60   # 60 × 10 s = 10 min
          i=0

          while [ $i -lt $MAX ]; do
            RESPONSE=$(curl -s \
              -u "${{ steps.kudu.outputs.kudu_user }}:${{ steps.kudu.outputs.kudu_pass }}" \
              "$KUDU")

            STATUS=$(echo "$RESPONSE" | jq -r '.status // 0')
            MSG=$(echo "$RESPONSE"    | jq -r '.status_text // "..."')

            echo "  [$(( i * 10 ))s] status=$STATUS  $MSG"

            if [ "$STATUS" = "4" ]; then
              echo "Build and deployment complete."
              break
            fi

            if [ "$STATUS" = "3" ]; then
              echo "Deployment failed."
              echo "$RESPONSE" | jq -r '.log_url // ""'
              exit 1
            fi

            i=$(( i + 1 ))
            sleep 10
          done

          if [ $i -ge $MAX ]; then
            echo "Deployment timed out after 10 minutes."
            exit 1
          fi

      # ── Run migrations via Kudu command API ─────────
      # Runs directly inside the container — no HTTP,
      # no gunicorn. antenv is guaranteed to exist here
      # because Oryx just finished building it above.
      - name: Run database migrations
        run: |
          echo "Running migrations..."
          RESPONSE=$(curl -s -X POST \
            "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/command" \
            -u "${{ steps.kudu.outputs.kudu_user }}:${{ steps.kudu.outputs.kudu_pass }}" \
            -H "Content-Type: application/json" \
            -d '{
              "command": "source antenv/bin/activate && python manage.py migrate --noinput && (python manage.py seed_assessment_categories 2>/dev/null || true)",
              "dir": "/home/site/wwwroot"
            }')

          echo "--- Output ---"
          echo "$RESPONSE" | jq -r '.Output // "no output"'

          ERRORS=$(echo "$RESPONSE" | jq -r '.Error // ""')
          [ -n "$ERRORS" ] && echo "--- Errors ---" && echo "$ERRORS"

          EXIT_CODE=$(echo "$RESPONSE" | jq -r '.ExitCode // 1')
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migrations failed (exit code $EXIT_CODE)."
            exit 1
          fi
          echo "Migrations completed successfully."

      # ── Health check ─────────────────────────────────
      - name: Health check
        run: |
          URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/docs/"
          MAX=18   # 18 × 10 s = 3 min
          i=0
          echo "Polling $URL ..."

          while [ $i -lt $MAX ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "  [$(( i * 10 ))s] HTTP $STATUS"

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "App is healthy."
              exit 0
            fi

            i=$(( i + 1 ))
            sleep 10
          done

          echo "App did not respond within 3 minutes — fetching logs..."
          az webapp log tail \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --timeout 15 || true
          exit 1

      - name: Cleanup
        if: always()
        run: rm -f deployment.zip

      - name: Deployment summary
        if: always()
        run: |
          echo "================================================"
          echo "App   : ${{ env.AZURE_WEBAPP_NAME }}"
          echo "URL   : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "Docs  : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/docs/"
          echo "Admin : https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/admin/"
          echo "================================================"
