name: Deploy Django to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AZURE_WEBAPP_NAME: 'django-web-app-914b2d44'
  RESOURCE_GROUP: 'django-app-rg'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Collect static files
      run: |
        python manage.py collectstatic --noinput
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DEBUG: 'False'
        ALLOWED_HOSTS: 'localhost'
    
    - name: Create deployment package
      run: |
        zip -r deployment.zip . \
          -x "*.git*" \
          -x "venv/*" \
          -x "env/*" \
          -x "*.pyc" \
          -x "__pycache__/*" \
          -x "db.sqlite3" \
          -x ".env*" \
          -x ".DS_Store" \
          -x "*.md" \
          -x ".vscode/*" \
          -x ".idea/*"
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Disable Azure build (use pre-built package)
      run: |
        az webapp config appsettings set \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --settings \
            SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            ENABLE_ORYX_BUILD=false \
            WEBSITE_RUN_FROM_PACKAGE=0
    
    - name: Set startup command directly
      run: |
        az webapp config set \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --startup-file "python manage.py migrate --noinput && gunicorn --bind=0.0.0.0 --timeout 600 childpassport.wsgi"
    
    - name: Deploy to Azure Web App (using az deploy)
      run: |
        az webapp deploy \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --src-path deployment.zip \
          --type zip \
          --async false
    
    - name: Restart Web App
      run: |
        echo "Restarting web app..."
        az webapp restart \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }}